<!DOCTYPE html>
<html lang="bn" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProductHub - প্রিমিয়াম প্রোডাক্ট শোকেস ও অর্ডার সিস্টেম</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navyPrimary: '#0f172a',
                        navySecondary: '#1e293b',
                    }
                }
            }
        }
    </script>
    <!-- Firebase App & Firestore SDKs (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        .daraz-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .daraz-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(15, 23, 42, 0.1);
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans selection:bg-blue-600 selection:text-white">

    <!-- Navbar -->
    <header class="bg-navyPrimary text-white shadow-lg sticky top-0 z-50 backdrop-blur-md bg-opacity-95">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-extrabold tracking-wide flex items-center gap-2">
                <span class="bg-blue-600 text-white p-1 rounded-md text-sm">PH</span> ProductHub
            </h1>
            <nav class="space-x-3 md:space-x-4 text-sm font-medium">
                <a href="#home" class="hover:text-blue-400 transition">হোম</a>
                <a href="#" onclick="openAdminPortal(event)" class="hover:text-blue-400 bg-blue-600 px-3 py-1.5 rounded-md shadow transition hover:bg-blue-700">অ্যাডমিন ড্যাশবোর্ড</a>
            </nav>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-10">

        <!-- Home Section / Product Showcase -->
        <section id="home">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-navyPrimary">সকল প্রোডাক্ট</h2>
                <span id="product-count" class="text-sm bg-slate-200 px-3 py-1 rounded-full font-medium">লোড হচ্ছে...</span>
            </div>

            <!-- Product Grid -->
            <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                <!-- ডায়নামিক প্রোডাক্ট এখানে ফায়ারবেস থেকে লোড হবে -->
            </div>
        </section>

        <!-- Admin Modal / Portal (Hidden by default) -->
        <div id="admin-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex justify-center items-center p-4">
            <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 space-y-4 relative">
                <button onclick="closeAdminPortal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
                
                <h3 id="admin-modal-title" class="text-xl font-bold text-navyPrimary">অ্যাডমিন লগইন</h3>
                
                <!-- Login Form -->
                <div id="admin-login-form" class="space-y-4">
                    <p class="text-sm text-slate-600">অ্যাডমিন প্যানেলে প্রবেশ করতে মাস্টার পাসওয়ার্ড দিন।</p>
                    <input type="password" id="admin-password" placeholder="পাসওয়ার্ড দিন (যেমন: 0182923)" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600">
                    <button onclick="verifyAdminPassword()" class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 transition">লগইন করুন</button>
                </div>

                <!-- Admin Dashboard Actions (Hidden initially) -->
                <div id="admin-dashboard" class="space-y-4 hidden">
                    <div class="bg-blue-50 p-3 rounded-lg text-sm text-blue-800 font-medium">
                        স্বাগতম! আপনি সফলভাবে অ্যাডমিন হিসেবে যুক্ত হয়েছেন।
                    </div>
                    <div class="space-y-3">
                        <h4 class="font-bold text-slate-700">নতুন প্রোডাক্ট যোগ করুন</h4>
                        <input type="text" id="new-p-name" placeholder="প্রোডাক্টের নাম" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                        <input type="text" id="new-p-price" placeholder="দাম (যেমন: 500 টাকা)" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                        <input type="text" id="new-p-img" placeholder="ছবির লিংক (Image URL)" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                        <button onclick="addNewProduct()" class="w-full bg-emerald-600 text-white py-2 rounded-lg font-medium hover:bg-emerald-700 transition">প্রোডাক্ট সেভ করুন</button>
                    </div>
                    <hr>
                    <div>
                        <h4 class="font-bold text-slate-700 mb-2">বিদ্যমান প্রোডাক্ট ডিলিট করুন</h4>
                        <div id="admin-product-list" class="max-h-40 overflow-y-auto space-y-2 text-sm">
                            <!-- ডিলিট করার লিস্ট এখানে দেখাবে -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Firebase Script & App Logic -->
    <script>
        // আপনার ফায়ারবেস কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyD0yAVMLW8gpfv_b6TJzxOmKP01nR0Tp5s",
            authDomain: "producthub-5926c.firebaseapp.com",
            projectId: "producthub-5926c",
            storageBucket: "producthub-5926c.firebasestorage.app",
            messagingSenderId: "943778967890",
            appId: "1:943778967890:web:b2bac4951f9806ea410a8b",
            measurementId: "G-QFB1YDWZ8J"
        };

        // ফায়ারবেস ইনিশিয়ালাইজ করা
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const MASTER_PASS = "0182923";

        // রিয়েল-টাইমে ফায়ারস্টোর থেকে প্রোডাক্ট লোড করা
        db.collection("products").onSnapshot((snapshot) => {
            const grid = document.getElementById("product-grid");
            const adminList = document.getElementById("admin-product-list");
            const countBadge = document.getElementById("product-count");
            
            grid.innerHTML = "";
            adminList.innerHTML = "";
            
            let products = [];
            snapshot.forEach((doc) => {
                products.push({ id: doc.id, ...doc.data() });
            });

            countBadge.innerText = `মোট প্রোডাক্ট: ${products.length}`;

            if(products.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-500 py-10">কোনো প্রোডাক্ট পাওয়া যায়নি। অ্যাডমিন প্যানেل থেকে নতুন প্রোডাক্ট যোগ করুন।</p>`;
                return;
            }

            products.forEach(p => {
                // ইউজার হোমপেজ কার্ড
                grid.innerHTML += `
                    <div class="bg-white rounded-lg shadow daraz-card p-3 flex flex-col justify-between">
                        <div>
                            <img src="${p.image || 'https://via.placeholder.com/150'}" alt="${p.name}" class="w-full h-40 object-cover rounded-md mb-3 bg-slate-100">
                            <h3 class="font-semibold text-sm text-slate-800 line-clamp-2">${p.name}</h3>
                        </div>
                        <div class="mt-3">
                            <p class="text-blue-600 font-bold text-base mb-2">${p.price}</p>
                            <a href="https://wa.me/?text=I want to buy ${encodeURIComponent(p.name)} - ${encodeURIComponent(p.price)}" target="_blank" class="block text-center bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2 rounded transition">অর্ডার করুন</a>
                        </div>
                    </div>
                `;

                // অ্যাডমিন ড্যাশবোর্ড ডিলেট লিস্ট
                adminList.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-50 p-2 rounded border">
                        <span class="truncate w-36">${p.name}</span>
                        <button onclick="deleteProduct('${p.id}')" class="bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded text-xs">ডিলিট</button>
                    </div>
                `;
            });
        });

        // অ্যাডমিন পোর্টাল ওপেন/ক্লোজ ফাংশন
        function openAdminPortal(e) {
            e.preventDefault();
            document.getElementById("admin-modal").classList.remove("hidden");
        }

        function closeAdminPortal() {
            document.getElementById("admin-modal").classList.add("hidden");
            document.getElementById("admin-password").value = "";
            document.getElementById("admin-login-form").classList.remove("hidden");
            document.getElementById("admin-dashboard").classList.add("hidden");
            document.getElementById("admin-modal-title").innerText = "অ্যাডমিন লগইন";
        }

        // পাসওয়ার্ড চেক করার ফাংশন
        function verifyAdminPassword() {
            const pass = document.getElementById("admin-password").value;
            if(pass === MASTER_PASS) {
                document.getElementById("admin-login-form").classList.add("hidden");
                document.getElementById("admin-dashboard").classList.remove("hidden");
                document.getElementById("admin-modal-title").innerText = "অ্যাডমিন ড্যাশবোর্ড";
            } else {
                alert("ভুল পাসওয়ার্ড! সঠিক পাসওয়ার্ড দিন।");
            }
        }

        // ডাটাবেজে নতুন প্রোডাক্ট সেভ করা
        function addNewProduct() {
            const name = document.getElementById("new-p-name").value.trim();
            const price = document.getElementById("new-p-price").value.trim();
            const image = document.getElementById("new-p-img").value.trim();

            if(!name || !price) {
                alert("দয়া করে অন্তত প্রোডাক্টের নাম এবং দাম লিখুন!");
                return;
            }

            db.collection("products").add({
                name: name,
                price: price,
                image: image || "https://via.placeholder.com/150",
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                alert("প্রোডাক্ট সফলভাবে গ্লোবালি যুক্ত হয়েছে!");
                document.getElementById("new-p-name").value = "";
                document.getElementById("new-p-price").value = "";
                document.getElementById("new-p-img").value = "";
            })
            .catch((error) => {
                console.error("ত্রুটি ঘটেছে: ", error);
                alert("প্রোডাক্ট সেভ করার সময় সমস্যা হয়েছে।");
            });
        }

        // প্রোডাক্ট ডিলিট করা
        function deleteProduct(id) {
            if(confirm("আপনি কি নিশ্চিতভাবে এই প্রোডাক্টটি ডিলিট করতে চান?")) {
                db.collection("products").doc(id).delete().then(() => {
                    alert("প্রোডাক্ট সফলভাবে ডিলিট করা হয়েছে!");
                }).catch((error) => {
                    console.error("ডিলিট করতে সমস্যা হয়েছে: ", error);
                });
            }
        }
    </script>
</body>
</html>
